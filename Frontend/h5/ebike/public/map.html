<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title></title>
    <style type="text/css">
      body,
      html,
      #container {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        font-family: "微软雅黑";
      }
      .anchorBL {
        display: none;
      }
      ul li {
        list-style: none;
      }
      .drawing-panel {
        z-index: 999;
        position: fixed;
        bottom: 2rem;
        margin-left: 14rem;
        padding-left: 0;
        border-radius: 0.25rem;
        height: 47px;
        box-shadow: 0 2px 6px 0 rgba(27, 142, 236, 0.5);
      }
      .bmap-btn {
        border-right: 1px solid #d2d2d2;
        float: left;
        width: 64px;
        height: 100%;
        background-image: url(https://api.map.baidu.com/library/DrawingManager/1.4/src/bg_drawing_tool.png);
        cursor: pointer;
      }
      .drawing-panel .bmap-marker {
        background-position: -65px 0;
      }
      .drawing-panel .bmap-polyline {
        background-position: -195px 0;
      }
      .drawing-panel .bmap-rectangle {
        background-position: -325px 0;
      }
      .drawing-panel .bmap-polygon {
        background-position: -260px 0;
      }
      .drawing-panel .bmap-circle {
        background-position: -130px 0;
      }
    </style>
    <script src="https://api.map.baidu.com/api?v=1.0&type=webgl&ak=3Nmg9MkgsR6sAMkHI2t1RH2FtW5nWZAk"></script>
    <script src="https://unpkg.com/mapvgl/dist/mapvgl.min.js"></script>
    <link
      href="https://mapopen.bj.bcebos.com/github/BMapGLLib/DrawingManager/src/DrawingManager.min.css"
      rel="stylesheet"
    />
    <script src="https://mapopen.bj.bcebos.com/github/BMapGLLib/DrawingManager/src/DrawingManager.min.js"></script>
  </head>

  <body>
    <ul class="drawing-panel" hidden>
      <li class="bmap-btn bmap-marker" id="marker" onclick="draw(this)"></li>
      <li
        class="bmap-btn bmap-polyline"
        id="polyline"
        onclick="draw(this)"
      ></li>
      <li
        class="bmap-btn bmap-rectangle"
        id="rectangle"
        onclick="draw(this)"
      ></li>
      <li class="bmap-btn bmap-polygon" id="polygon" onclick="draw(this)"></li>
      <li class="bmap-btn bmap-circle" id="circle" onclick="draw(this)"></li>
    </ul>
    <div id="container"></div>
  </body>

  <script>
    let map,
      local,
      view,
      layer_car_run,
      layer_car_stop,
      layer_car_fault,
      layer_car_alert,
      layer_car_offline,
      layer_storage,
      layer_text,
      drawingManager;

    function getArea(p0, p1, p2) {
      let area = 0.0;
      area =
        p0[0] * p1[1] +
        p1[0] * p2[1] +
        p2[0] * p0[1] -
        p1[0] * p0[1] -
        p2[0] * p1[1] -
        p0[0] * p2[1];
      return area / 2;
    }

    function getPolygonCenter(points) {
      if (points.length < 2) return [0, 0];

      let sum_x = 0;
      let sum_y = 0;
      let sum_area = 0;
      let p1 = points[1];

      for (let i = 2; i < points.length; i++) {
        let p2 = points[i];
        let area = getArea(points[0], p1, p2);
        sum_area += area;
        sum_x += (points[0][0] + p1[0] + p2[0]) * area;
        sum_y += (points[0][1] + p1[1] + p2[1]) * area;
        p1 = p2;
      }

      let xx = sum_x / sum_area / 3;
      let yy = sum_y / sum_area / 3;
      return new BMapGL.Point(xx, yy);
    }

    window.onload = function () {
      map = new BMapGL.Map("container");
      map.setMapStyleV2({
        styleId: "c45f54617e610245f8b02ff0c54b2084",
      });
      // map.setMapStyleV2({
      //   styleId: "1240484b3402792909e6276ceb9a56ef"
      // });
      map.enableScrollWheelZoom();
      map.setTilt(75);
      setCenter(104.0000, 23.0000, 15);

      let options = {
        onSearchComplete: function (results) {
          if (local.getStatus() == BMAP_STATUS_SUCCESS) {
            let s = [];
            for (let i = 0; i < results.getCurrentNumPois(); i++) {
              s.push({
                label:
                  results.getPoi(i).title + ", " + results.getPoi(i).address,
                value: results.getPoi(i).point,
              });
            }
            window.parent.postMessage({ method: "search", params: s }, "*");
          }
        },
      };
      local = new BMapGL.LocalSearch(map, options);

      view = new mapvgl.View({
        map: map,
      });

      layer_car_run = new mapvgl.IconLayer({
        icon: "car_run.svg",
        enablePicked: true,
        selectedIndex: -1,
        selectedColor: "#ff0000",
        autoSelect: true,
        onClick: (e) => {
          if (e.dataIndex === -1) return;

          map.openInfoWindow(
            new BMapGL.InfoWindow(e.dataItem.properties.info),
            new BMapGL.Point(
              e.dataItem.geometry.coordinates[0],
              e.dataItem.geometry.coordinates[1]
            )
          );
        },
      });
      view.addLayer(layer_car_run);

      layer_car_stop = new mapvgl.IconLayer({
        icon: "car_stop.svg",
        enablePicked: true,
        selectedIndex: -1,
        selectedColor: "#ff0000",
        autoSelect: true,
        onClick: (e) => {
          if (e.dataIndex === -1) return;

          map.openInfoWindow(
            new BMapGL.InfoWindow(e.dataItem.properties.info),
            new BMapGL.Point(
              e.dataItem.geometry.coordinates[0],
              e.dataItem.geometry.coordinates[1]
            )
          );
        },
      });
      view.addLayer(layer_car_stop);

      layer_car_fault = new mapvgl.IconLayer({
        icon: "car_fault.svg",
        enablePicked: true,
        selectedIndex: -1,
        selectedColor: "#ff0000",
        autoSelect: true,
        onClick: (e) => {
          if (e.dataIndex === -1) return;

          map.openInfoWindow(
            new BMapGL.InfoWindow(e.dataItem.properties.info),
            new BMapGL.Point(
              e.dataItem.geometry.coordinates[0],
              e.dataItem.geometry.coordinates[1]
            )
          );
        },
      });
      view.addLayer(layer_car_fault);

      layer_car_alert = new mapvgl.IconLayer({
        icon: "car_alert.svg",
        enablePicked: true,
        selectedIndex: -1,
        selectedColor: "#ff0000",
        autoSelect: true,
        onClick: (e) => {
          if (e.dataIndex === -1) return;

          map.openInfoWindow(
            new BMapGL.InfoWindow(e.dataItem.properties.info),
            new BMapGL.Point(
              e.dataItem.geometry.coordinates[0],
              e.dataItem.geometry.coordinates[1]
            )
          );
        },
      });
      view.addLayer(layer_car_alert);

      layer_car_offline = new mapvgl.IconLayer({
        icon: "car_offline.svg",
        enablePicked: true,
        selectedIndex: -1,
        selectedColor: "#ff0000",
        autoSelect: true,
        onClick: (e) => {
          if (e.dataIndex === -1) return;

          map.openInfoWindow(
            new BMapGL.InfoWindow(e.dataItem.properties.info),
            new BMapGL.Point(
              e.dataItem.geometry.coordinates[0],
              e.dataItem.geometry.coordinates[1]
            )
          );
        },
      });
      view.addLayer(layer_car_offline);

      layer_storage = new mapvgl.PolygonLayer({
        lineColor: "rgba(94, 135, 218, 1)",
        lineWidth: 2,
        fillColor: "rgba(94, 135, 218, 0.6)",
        enablePicked: true,
        selectedIndex: -1,
        selectedColor: "#ff0000",
        autoSelect: true,
        onClick: (e) => {
          if (e.dataIndex === -1) return;

          let pt = getPolygonCenter(e.dataItem.geometry.coordinates[0]);
          map.openInfoWindow(
            new BMapGL.InfoWindow(e.dataItem.properties.info),
            new BMapGL.Point(pt.lng, pt.lat)
          );
        },
        onRightClick: (e) => {
          window.parent.postMessage(
            { method: "delete", params: e.dataItem.properties.code },
            "*"
          );
        },
      });
      view.addLayer(layer_storage);

      layer_text = new mapvgl.TextLayer({
        color: "#31CCEC",
        fontSize: 24,
        fontFamily: "汉真广标",
      });
      view.addLayer(layer_text);

      let styleOptions = {
        strokeColor: "#5E87DB",
        fillColor: "#5E87DB",
        strokeWeight: 2,
        strokeOpacity: 1,
        fillOpacity: 0.2,
      };
      drawingManager = new BMapGLLib.DrawingManager(map, {
        enableCalculate: false,
        enableSorption: true,
        sorptiondistance: 20,
        circleOptions: styleOptions,
        polylineOptions: styleOptions,
        polygonOptions: styleOptions,
        rectangleOptions: styleOptions,
        labelOptions: {
          borderRadius: "2px",
          background: "#FFFBCC",
          border: "1px solid #E1E1E1",
          color: "#703A04",
          fontSize: "12px",
          letterSpacing: "0",
          padding: "5px",
        },
      });
      drawingManager.addEventListener("overlaycomplete", overlaycomplete);

      map.addEventListener("touchmove", onTouchMove);
      map.addEventListener("touchend", onTouchEnd);

      window.addEventListener("message", onMessage);

      window.parent.postMessage({ method: "init" }, "*");
    };

    window.onunload = function () {
      drawingManager.removeEventListener("overlaycomplete", overlaycomplete);
      map.removeEventListener("touchmove", onTouchMove);
      map.removeEventListener("touchend", onTouchEnd);
      window.removeEventListener("message", onMessage);
    };

    function clear(value) {
      map.clearOverlays();
    }

    function setCenter(lng, lat, level) {
      map.centerAndZoom(new BMapGL.Point(lng, lat), level);
    }

    function setCar(
      runPoints,
      stopPoints,
      faultPoints,
      alertPoints,
      offlinePoints
    ) {
      layer_car_run.setData(runPoints);
      layer_car_stop.setData(stopPoints);
      layer_car_fault.setData(faultPoints);
      layer_car_alert.setData(alertPoints);
      layer_car_offline.setData(offlinePoints);
    }

    function setPolygon(points) {
      layer_storage.setData(points);
    }

    function setText(points) {
      layer_text.setData(points);
    }

    function drawPanel(val) {
      document.querySelector("body > ul").hidden = val;
    }

    function draw(e) {
      let arr = document.getElementsByClassName("bmap-btn");
      for (let i = 0; i < arr.length; i++) {
        arr[i].style.backgroundPositionY = "0";
      }

      e.style.backgroundPositionY = "-52px";

      let drawingType = BMAP_DRAWING_RECTANGLE;

      switch (e.id) {
        case "marker": {
          drawingType = BMAP_DRAWING_MARKER;
          break;
        }
        case "polyline": {
          drawingType = BMAP_DRAWING_POLYLINE;
          break;
        }
        case "rectangle": {
          drawingType = BMAP_DRAWING_RECTANGLE;
          break;
        }
        case "polygon": {
          drawingType = BMAP_DRAWING_POLYGON;
          break;
        }
        case "circle": {
          drawingType = BMAP_DRAWING_CIRCLE;
          break;
        }
      }

      if (
        drawingManager._isOpen &&
        drawingManager.getDrawingMode() === drawingType
      ) {
        drawingManager.close();
      } else {
        drawingManager.setDrawingMode(drawingType);
        drawingManager.open();

        window.parent.postMessage({ method: "startDraw" }, "*");
      }
    }

    function localSearch(value) {
      local.search(value);
    }

    function onMessage(event) {
      console.log(event.data);
    }

    function navigation(locate, marker) {
      let p1 = new BMapGL.Point(locate.lng, locate.lat);
      let p2 = new BMapGL.Point(marker.lng, marker.lat);

      let driving = new BMapGL.DrivingRoute(map, {
        renderOptions: { map: map, autoViewport: true },
      });
      driving.search(p1, p2);
    }

    function overlaycomplete(e) {
      window.parent.postMessage(
        { method: "endDraw", params: e.overlay.getPath() },
        "*"
      );
    }

    function onTouchMove() {
      map.enableDragging();
    }

    function onTouchEnd() {
      map.disableDragging();
    }
  </script>
</html>
