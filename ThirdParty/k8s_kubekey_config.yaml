apiVersion: kubekey.kubesphere.io/v1alpha2
kind: Cluster
metadata:
  name: sample
spec:
  hosts:
    - {
        name: master1,
        address: 192.168.21.102,
        internalAddress: 192.168.21.102,
        user: root,
        password: "ChangeMeKubeKey123!",
      }
    - {
        name: master2,
        address: 192.168.21.103,
        internalAddress: 192.168.21.103,
        user: root,
        password: "ChangeMeKubeKey123!",
      }
    - {
        name: master3,
        address: 192.168.21.104,
        internalAddress: 192.168.21.104,
        user: root,
        password: "ChangeMeKubeKey123!",
      }
    - {
        name: worker1,
        address: 192.168.21.105,
        internalAddress: 192.168.21.105,
        user: root,
        password: "ChangeMeKubeKey123!",
      }
    - {
        name: worker2,
        address: 192.168.21.106,
        internalAddress: 192.168.21.106,
        user: root,
        password: "ChangeMeKubeKey123!",
      }
    - {
        name: worker3,
        address: 192.168.21.107,
        internalAddress: 192.168.21.107,
        user: root,
        password: "ChangeMeKubeKey123!",
      }
  roleGroups:
    etcd:
      - master1
      - master2
      - master3
    control-plane:
      - master1
      - master2
      - master3
    worker:
      - master1
      - master2
      - master3
      - worker1
      - worker2
      - worker3
  controlPlaneEndpoint:
    internalLoadbalancer: haproxy
    domain: lb.kubesphere.local
    address: ""
    port: 6443
  kubernetes:
    version: v1.28.12
    clusterName: cluster.local
    autoRenewCerts: true
    containerManager: containerd
  etcd:
    type: kubekey
  network:
    plugin: calico
    kubePodsCIDR: 10.233.64.0/18
    kubeServiceCIDR: 10.233.0.0/18
    multusCNI:
      enabled: false
  registry:
    privateRegistry: "dockerproxy.net"
    namespaceOverride: "kubesphereio"
    registryMirrors: ["https://dockerproxy.net"]
    insecureRegistries: ["https://dockerproxy.net"]
  addons: []
