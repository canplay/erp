services:
  nakama:
    container_name: nakama
    image: heroiclabs/nakama:3.22.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres://logto:kR7xNQFy4cHMCZEm@1Panel-postgresql-JNr8:5432/nakama &&
        /nakama/nakama --config /nakama/data/config.yaml &&
        exec /nakama/nakama --name nakama1 --database.address postgres://logto:kR7xNQFy4cHMCZEm@1Panel-postgresql-JNr8:5432/nakama --logger.level DEBUG --session.token_expiry_sec 7200
    restart: always
    volumes:
      - ./data:/nakama/data
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "8940:7349"
      - "8941:7350"
      - "8942:7351"
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus
    entrypoint: /bin/sh -c
    command: |
      'sh -s <<EOF
        cat > ./prometheus.yml <<EON
      global:
        scrape_interval:     15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: prometheus
          static_configs:
          - targets: ['localhost:9090']

        - job_name: nakama
          metrics_path: /
          static_configs:
          - targets: ['nakama:9100']
      EON
      prometheus --config.file=./prometheus.yml
      EOF'
    ports:
      - "9090:9090"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
